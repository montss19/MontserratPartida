<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Wave 1</title>
    <link rel="stylesheet" href="style.css">
  </head>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgb(182, 216, 255);
}
</style>
  <body>

    <canvas id="canvas" width="600" height="400"></canvas>

    <script>
    window.onload = function () {

      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),

          // IMAGEN
          imagen = new Image(),

          angle = 0,
          centerY = 200,
          range = 50,
          xspeed = 1,
          yspeed = 0.05,

          // posición de la imagen
          x = 0,
          y;

      // AQUÍ PONES EL NOMBRE DE TU IMAGEN
      imagen.src = "pelota.png";

      // Cuando la imagen termine de cargar
      
    imagen.onload = function () {

    (function drawFrame () {

        window.requestAnimationFrame(drawFrame);

        context.clearRect(0, 0, canvas.width, canvas.height);

        // Movimiento horizontal
        x += xspeed;

        // Reiniciar cuando salga del canvas
        if (x > canvas.width) {
            x = -100;
        }

        // Movimiento en onda
        y = centerY / 2 + Math.sin(angle) * range;

        angle += yspeed;

        // Dibujar imagen
        context.drawImage(
            imagen,
            x,
            y,
            250,
            170
          );

        }());
      };

    };
    </script>

  </body>
</html>
