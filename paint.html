<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
    <meta charset="utf-8">
    <title>Mi Paint</title>
    <style>
      body { 
    text-align: center;
    margin-top: 20px;
    background-image: url("fondo.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
      canvas {
        background-color: white;
      }
      .colores{
        width: 100%;
        height: 50px;
        text-align: center;
      }
      .colores button{
        width: 100px;
        height: 40px;
        margin-right: 5px;
        margin-top: 5px;
        color: white;
        font: 25px impact;
        cursor: pointer;
        border-radius: 15px;
      }
      .colores button:hover{
        opacity: 0.5;
      }

      #black{
        background: black;
      }
      #red{
        background: red;
      }
      #green{
        background: rgb(5, 160, 0);
      }
      #blue{
        background: rgb(0, 80, 219);
      }
      #yellow{
        background: rgb(245, 227, 66);
      }
      #purple{
        background: rgb(109, 14, 183);
      }
       #orange{
        background: #f48734;
      }
      #pink{
        background: #fb95f9;
      }

       #otros button{
        width: 300px;
        height: 50px;
        background: #303030;
        color: white;
        font: 25px impact;
        cursor: pointer;
        margin-bottom: 5px;
        border-radius: 15px;
      }
      #otros button:hover{
        opacity: 0.5;
      }
    </style>
  </head>
  <body id="paint-body">
<aside class="instrucciones">
      <h2>Instrucciones</h2>
      <p>Haz clic y arrastra el mouse sobre el canvas para dibujar.</p>
      <p>Selecciona un color y un grosor antes de comenzar.</p>
    </aside>
  <div class="contenedor">

    <div class="panel">
    <div class="colores">
      <button id="black" type="button" value="#000000"></button>
      <button id="red" type="button" value="#ff0000"></button>
      <button id="blue" type="button" value="#0000ff"></button>
      <button id="green" type="button" value="#008000"></button>
      <button id="yellow" type="button" value="#ffd700"></button>
      <button id="purple" type="button" value="#800080"></button>
      <button id="orange" type="button" value="#f48734"></button>
      <button id="pink" type="button" value="#fb95f9"></button>
    </div>

     </div>

      <div id="otros">
        <button id="clear" type="button">Borrar todo</button>
        <div class="grosores">
  <p>Grosor de pluma</p>

  <button type="button" data-grosor="2" title="Delgado">
    Delgado
  </button>

  <button type="button" data-grosor="5" title="Mediano">
    Mediano
  </button>

  <button type="button" data-grosor="10" title="Grueso">
    Grueso
  </button>
      </div>
    </div>

    <div class="zona-dibujo">
      <canvas id="canvas" width="1000" height="700"></canvas>
    </div>

  </div>

    <script src="utils.js"></script>
    <script>
    
window.onload = function () {
  var canvas = document.getElementById('canvas'),
      context = canvas.getContext('2d'),
      mouse = utils.captureMouse(canvas);

  // Configuración inicial del trazo
  context.strokeStyle = '#000000';
  context.lineWidth = 3;
  context.lineCap = 'round';
  context.lineJoin = 'round';

  // Empezar a dibujar
  canvas.addEventListener('mousedown', function () {
    context.beginPath();
    context.moveTo(mouse.x, mouse.y);
    canvas.addEventListener('mousemove', onMouseMove, false);
  }, false);

  // Dejar de dibujar
  canvas.addEventListener('mouseup', function () {
    canvas.removeEventListener('mousemove', onMouseMove, false);
  }, false);

  canvas.addEventListener('mouseleave', function () {
    canvas.removeEventListener('mousemove', onMouseMove, false);
  }, false);

  function onMouseMove () {
    context.lineTo(mouse.x, mouse.y);
    context.stroke();
  }

  // Cambiar color de trazo
  var colores = document.getElementsByClassName('colores')[0];

  colores.addEventListener('click', function(event) {
    if (event.target.tagName === 'BUTTON') {
      context.strokeStyle = event.target.value;
    }
  });

  // Cambiar grosor de la pluma
  var botonesGrosor = document.querySelectorAll('.grosores button');

  botonesGrosor.forEach(function(boton) {
    boton.addEventListener('click', function() {
      context.lineWidth = Number(boton.getAttribute('data-grosor'));
      console.log('Grosor actual:', context.lineWidth);
    });
  });

  // Borrar todo
  var clearButton = document.getElementById('clear');

  clearButton.addEventListener('click', function() {
    context.clearRect(0, 0, canvas.width, canvas.height);
  });
};



    </script>
  </body>
</html>
